# Woodpecker CI on Pegasus — build/push fork image to GHCR for TrueNAS.
#
# Flow: docker build (host sock) → push ghcr.io/sp-937-215/moltis
# Public CI: https://ci.qod.name
#
# Repo settings in Woodpecker:
#   - Trusted + Trusted Volumes (docker.sock + ~/.docker/config.json)
#   - Events: push + manual
# GHCR auth (same as TMS):
#   host `docker login ghcr.io -u SP-937-215` → ~/.docker/config.json mounted below
# Optional later: add GHCR_USERNAME/GHCR_TOKEN secrets and wire from_secret if needed

when:
  - event: push
    branch:
      - fix/aud-2026-001-remediation
      - main
  - event: manual

variables:
  - &docker_image "docker:27-cli"
  - &image_repo "ghcr.io/sp-937-215/moltis"

steps:
  - name: publish-image
    image: *docker_image
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/quentin/.docker/config.json:/root/.docker/config.json:ro
    environment:
      IMAGE_REPO: *image_repo
    commands:
      - apk add --no-cache bash git
      - chmod +x deploy/woodpecker/ci-publish.sh
      - bash deploy/woodpecker/ci-publish.sh
